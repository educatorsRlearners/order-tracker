apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker
    folder: Order Tracker
    interval: 1m
    rules:
      - uid: order-tracker-5xx
        title: Order Tracker 5xx responses
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: sum by (http_route) (increase(order_tracker_http_requests_total{http_response_status_code=~"5.."}[5m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        # Prometheus has no 5xx series until the first 5xx, so "no data" means "no errors".
        noDataState: OK
        execErrState: Error
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: '5xx responses on {{ $labels.http_route }}'
          description: >-
            {{ $labels.http_route }} returned {{ printf "%.0f" $values.B.Value }} 5xx
            response(s) in the last 5 minutes. Dashboard:
            http://localhost:3000/d/order-tracker-requests/order-tracker-requests-and-errors?from=now-30m&to=now
          __dashboardUid__: order-tracker-requests
          __panelId__: "7"
